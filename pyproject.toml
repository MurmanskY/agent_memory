[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-lab"
version = "0.1.0"
description = "Research framework for LLM agent long-term memory (baselines, our methods, benchmarks)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openai>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
bench = ["pyarrow>=14"]            # MemoryAgentBench parquet loading
st = ["sentence-transformers>=2.2"]  # all-MiniLM-L6-v2 embedder (paper setting)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
