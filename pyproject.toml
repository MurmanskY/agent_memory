[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-lab"
version = "0.1.0"
description = "Research framework for trustworthy LLM agent memory (baselines, security benchmarks, our methods)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openai>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
bench = ["pyarrow>=14", "nltk>=3.8"]  # MemoryAgentBench parquet + LoCoMo BLEU-1
st = ["sentence-transformers>=2.2"]  # all-MiniLM-L6-v2 embedder (paper setting)
security = ["transformers>=4.51", "scikit-learn>=1.3", "sentence-transformers>=2.2"]
trustmem = ["transformers>=4.51", "tiktoken>=0.7", "pandas>=2.0", "pyarrow>=14", "vllm>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
